name: CI

# Correctness gate for every push and pull request. The addon has no build
# step, so the checks are the ones that catch real breakage: every Lua file
# must parse as Lua 5.1 (what the client runs), and the TOC must list only
# files that exist and carry an Interface line.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changelog updated
        # House rule: a change to the addon lands with a line under
        # "## Unreleased" in CHANGELOG.md in the same PR. Pull requests only,
        # so the version-bump commit on main is never blocked.
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base...HEAD")
          echo "$changed"
          if echo "$changed" | grep -q '^MooseMode/' && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "Addon files changed but CHANGELOG.md did not. Add a line under ## Unreleased."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install luaparse
        run: npm i -g luaparse@0.3.1

      - name: Lua 5.1 syntax
        run: |
          node -e '
            const luaparse = require(require("path").join(require("child_process").execSync("npm root -g").toString().trim(), "luaparse"));
            const fs = require("fs"), path = require("path");
            const files = [];
            (function walk(d) { for (const e of fs.readdirSync(d, { withFileTypes: true })) {
              const p = path.join(d, e.name);
              if (e.isDirectory()) walk(p); else if (p.endsWith(".lua")) files.push(p); } })("MooseMode");
            let failed = 0;
            for (const f of files) {
              try { luaparse.parse(fs.readFileSync(f, "utf8"), { luaVersion: "5.1" }); console.log("ok  ", f); }
              catch (e) { failed++; console.log("FAIL", f, "-", e.message); }
            }
            if (!files.length) { console.log("no Lua files found"); process.exit(1); }
            if (failed) process.exit(1);
          '

      - name: TOC sanity
        run: |
          toc=MooseMode/MooseMode.toc
          test -f "$toc" || { echo "missing $toc"; exit 1; }
          grep -q '^## Interface:' "$toc" || { echo "no ## Interface line"; exit 1; }
          grep -q '^## Version:' "$toc" || { echo "no ## Version line"; exit 1; }
          status=0
          while IFS= read -r line; do
            line="${line%$'\r'}"
            case "$line" in ''|'#'*) continue ;; esac
            f="MooseMode/${line//\\//}"
            if [ -f "$f" ]; then echo "ok   $f"; else echo "MISSING $f"; status=1; fi
          done < "$toc"
          exit $status
